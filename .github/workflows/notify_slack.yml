name: Notify Slack on PR

on:
  pull_request:
    types: [opened]

jobs:
  slack-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification via Curl
        env:
          # Load data into environment variables first
          SLACK_WEBHOOK_URL: ${{ secrets.WORKFLOW_URL }}
          REPO: ${{ github.event.repository.full_name }}
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          LINK: ${{ github.event.pull_request.html_url }}
        run: |
          # 1. Create safe JSON using 'jq' (handles quotes/newlines automatically)
          JSON_PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --arg title "$TITLE" \
            --arg author "$AUTHOR" \
            --arg link "$LINK" \
            '{repo_fullname: $repo, pr_title: $title, pr_author: $author, pr_link: $link}')

          # 2. Print JSON for debugging (Sensitive data masked in logs)
          echo "Sending payload..."

          # 3. Send to Slack
          curl -X POST -H "Content-Type: application/json" -d "$JSON_PAYLOAD" "$SLACK_WEBHOOK_URL"
